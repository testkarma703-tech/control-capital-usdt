<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Control de Capital USDT</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root { --bg:#fff; --text:#000; --card:#f2f2f2; }
.dark { --bg:#121212; --text:#e0e0e0; --card:#1e1e1e; }
body { font-family:Arial; background:var(--bg); color:var(--text); max-width:750px; margin:auto; padding:15px; }
.card { background:var(--card); padding:15px; border-radius:8px; margin-bottom:15px; }
input,button { padding:8px; margin:5px 0; width:100%; } button { cursor:pointer; }
table { width:100%; border-collapse:collapse; } th,td { border-bottom:1px solid #888; padding:6px; text-align:center; }
.green { color:#4caf50; } .red { color:#f44336; }
</style>
</head>
<body>
<button onclick="toggleDark()">Modo oscuro</button>
<h2>Control de Capital (USDT)</h2>
<div id="capitalSetup" class="card"><label>Capital inicial (USDT)</label><input type="number" id="capitalInicialInput"><button onclick="guardarCapital()">Guardar capital</button></div>
<div id="app" style="display:none;">
<div class="card"><p><strong>Capital inicial:</strong> <span id="capitalInicial"></span> USDT</p><p><strong>Capital total acumulado:</strong> <span id="capitalTotal"></span> USDT</p><p><strong>USDT acumulados:</strong> <span id="usdtAcumulados"></span> USDT</p><p><strong>ROI total:</strong> <span id="roiTotal"></span></p><p><strong>Estado del día:</strong> <span id="estadoObjetivo"></span></p><hr><p><strong>Días cumplidos:</strong> <span id="diasCumplidos"></span></p><p><strong>Días operados:</strong> <span id="diasTotales"></span></p><p><strong>% cumplimiento:</strong> <span id="porcentajeCumplimiento"></span></p></div>
<div class="card"><label>Resultado del día (USDT)</label><input type="number" id="resultadoDia"><button onclick="agregarDia()">Añadir día</button><button onclick="exportarExcel()">Exportar a Excel</button></div>
<div class="card"><canvas id="grafica"></canvas></div>
</div>
<script>
const OBJETIVO_PCT=2; let capitalInicial=parseFloat(localStorage.getItem('capitalInicial')); let historial=JSON.parse(localStorage.getItem('historial'))||[]; let dark=localStorage.getItem('dark')==='true'; let chart;
if(dark)document.body.classList.add('dark');
function toggleDark(){dark=!dark;document.body.classList.toggle('dark');localStorage.setItem('dark',dark);}
function guardarCapital(){capitalInicial=parseFloat(document.getElementById('capitalInicialInput').value);localStorage.setItem('capitalInicial',capitalInicial);iniciarApp();}
function iniciarApp(){document.getElementById('capitalSetup').style.display='none';document.getElementById('app').style.display='block';document.getElementById('capitalInicial').textContent=capitalInicial.toFixed(2);actualizar();}
function agregarDia(){const resultado=parseFloat(document.getElementById('resultadoDia').value);if(isNaN(resultado))return;historial.push({fecha:new Date().toLocaleDateString(),resultado});localStorage.setItem('historial',JSON.stringify(historial));document.getElementById('resultadoDia').value='';actualizar();}
function exportarExcel(){let capital=capitalInicial;let csv='Fecha,Resultado USDT,Capital después\n';historial.forEach(d=>{capital+=d.resultado;csv+=`${d.fecha},${d.resultado.toFixed(2)},${capital.toFixed(2)}\n`;});const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob);const link=document.createElement('a');const fecha=new Date().toISOString().slice(0,10);link.href=url;link.download=`control_capital_${fecha}.csv`;document.body.appendChild(link);link.click();document.body.removeChild(link);}
function actualizar(){let capital=capitalInicial,diasCumplidos=0,labels=[],data=[];historial.forEach(d=>{let objetivo=capital*OBJETIVO_PCT/100;if(d.resultado>=objetivo)diasCumplidos++;capital+=d.resultado;labels.push(d.fecha);data.push(capital);});let usdtGanados=capital-capitalInicial,roiPct=(usdtGanados/capitalInicial)*100,ultimoResultado=historial.length?historial[historial.length-1].resultado:0,objetivoHoy=capital*OBJETIVO_PCT/100;document.getElementById('capitalTotal').textContent=capital.toFixed(2);document.getElementById('usdtAcumulados').textContent=(usdtGanados>=0?'+':'')+usdtGanados.toFixed(2);document.getElementById('usdtAcumulados').className=usdtGanados>=0?'green':'red';document.getElementById('roiTotal').textContent=(roiPct>=0?'+':'')+roiPct.toFixed(2)+' %';document.getElementById('estadoObjetivo').textContent=ultimoResultado>=objetivoHoy?'OBJETIVO CUMPLIDO':'OBJETIVO NO CUMPLIDO';document.getElementById('diasCumplidos').textContent=diasCumplidos;document.getElementById('diasTotales').textContent=historial.length;document.getElementById('porcentajeCumplimiento').textContent=historial.length?((diasCumplidos/historial.length)*100).toFixed(2)+' %':'0 %';if(chart)chart.destroy();chart=new Chart(document.getElementById('grafica'),{type:'line',data:{labels,datasets:[{data,borderWidth:2,tension:.3}]},options:{plugins:{legend:{display:false}}}});}
if(capitalInicial)iniciarApp();
</script>
</body>
</html>
